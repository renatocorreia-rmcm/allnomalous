<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1040" viewBox="0 0 1640 1040" role="img" aria-labelledby="title desc">
  <title id="title">Protocolo experimental do detector</title>
  <desc id="desc">Treino combinado, selecao por validacao normal e avaliacao unica em teste intocado, comparando baseline e modelo completo.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#bf8700"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #24292f; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #57606a; }
      .box { stroke-width: 2; rx: 14; }
      .heading { font-size: 18px; font-weight: 700; text-anchor: middle; }
      .body { font-size: 15px; text-anchor: middle; fill: #424a53; }
      .arrow { stroke: #57606a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #bf8700; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow-orange); }
      .note { font-size: 15px; fill: #424a53; }
    </style>
  </defs>
  <rect width="1640" height="1040" fill="#f6f8fa"/>
  <text class="title" x="50" y="62">Protocolo experimental</text>
  <text class="subtitle" x="50" y="101">As 15 categorias sao combinadas no treino; identidade de categoria nunca entra no modelo.</text>

  <rect class="box" x="50" y="260" width="300" height="155" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="heading" x="200" y="305">Treino combinado</text>
  <text class="body" x="200" y="342"><tspan x="200">3.262 imagens normais</tspan><tspan x="200" dy="23">15 categorias misturadas</tspan><tspan x="200" dy="23">imagem apenas no forward</tspan></text>

  <rect class="box" x="50" y="500" width="300" height="155" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="heading" x="200" y="545">Validacao normal</text>
  <text class="body" x="200" y="582"><tspan x="200">367 imagens normais</tspan><tspan x="200" dy="23">loss para early stopping</tspan><tspan x="200" dy="23">sem dados do teste</tspan></text>

  <rect class="box" x="50" y="780" width="300" height="175" fill="#ffebe9" stroke="#ff8182"/>
  <text class="heading" x="200" y="825">Teste oficial intocado</text>
  <text class="body" x="200" y="862"><tspan x="200">1.725 imagens; 15 categorias</tspan><tspan x="200" dy="23">467 normais; 1.258 defeituosas</tspan><tspan x="200" dy="23">imagem, mascara, label e categoria</tspan></text>

  <rect class="box" x="475" y="250" width="350" height="150" fill="#fbefff" stroke="#bf8bff"/>
  <text class="heading" x="650" y="292">Ajustar baseline</text>
  <text class="body" x="650" y="329"><tspan x="650">decoder sem jitter e sem mascara</tspan><tspan x="650" dy="23">seed 42; AdamW; ate 30 epocas</tspan><tspan x="650" dy="23">loss MSE de reconstrucao</tspan></text>

  <rect class="box" x="475" y="490" width="350" height="165" fill="#fbefff" stroke="#bf8bff"/>
  <text class="heading" x="650" y="532">Ajustar versao completa</text>
  <text class="body" x="650" y="569"><tspan x="650">mesmo protocolo e arquitetura</tspan><tspan x="650" dy="23">jitter + atencao local mascarada</tspan><tspan x="650" dy="23">mesma seed, dados e hiperparametros</tspan></text>

  <rect class="box" x="920" y="365" width="285" height="185" fill="#fff8c5" stroke="#d4a72c"/>
  <text class="heading" x="1062" y="407">Selecao por validacao</text>
  <text class="body" x="1062" y="444"><tspan x="1062">acompanhar loss normal</tspan><tspan x="1062" dy="23">scheduler cosine; patience 5</tspan><tspan x="1062" dy="23">guardar melhor checkpoint</tspan><tspan x="1062" dy="23">selecionar sem olhar teste</tspan></text>

  <rect class="box" x="1300" y="365" width="285" height="185" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="heading" x="1442" y="407">Congelar protocolo</text>
  <text class="body" x="1442" y="444"><tspan x="1442">baseline + completo</tspan><tspan x="1442" dy="23">fixar pesos e configuracoes</tspan><tspan x="1442" dy="23">antes da avaliacao final</tspan></text>

  <rect class="box" x="920" y="780" width="285" height="175" fill="#ddf4ff" stroke="#54aeff"/>
  <text class="heading" x="1062" y="825">Inferencia no teste</text>
  <text class="body" x="1062" y="862"><tspan x="1062">modelo recebe apenas imagem</tspan><tspan x="1062" dy="23">gerar escore e mapa por pixel</tspan><tspan x="1062" dy="23">uma avaliacao apos selecao</tspan></text>

  <rect class="box" x="1300" y="780" width="285" height="175" fill="#dafbe1" stroke="#4ac26b"/>
  <text class="heading" x="1442" y="825">Metricas finais</text>
  <text class="body" x="1442" y="862"><tspan x="1442">AUROC de imagem e de pixel</tspan><tspan x="1442" dy="23">AUPRO</tspan><tspan x="1442" dy="23">por categoria e media macro</tspan></text>

  <path class="arrow" d="M353 330 H471"/>
  <path class="arrow" d="M350 345 H410 V570 H471"/>
  <path class="arrow" d="M353 578 H600 V404 H916"/>
  <path class="arrow" d="M353 600 H430 V630 H471"/>
  <path class="feedback" d="M916 430 H850 V325 H829"/>
  <path class="feedback" d="M916 485 H875 V570 H829"/>
  <path class="arrow" d="M828 315 H1260 V405 H1296"/>
  <path class="arrow" d="M828 575 H1240 V500 H1296"/>
  <path class="arrow" d="M1442 554 V705 H1062 V776"/>
  <path class="arrow" d="M353 855 H916"/>
  <path class="arrow" d="M1208 865 H1296"/>
  <path d="M350 910 H700 V975 H1442 V959" stroke="#bf8700" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arrow-orange)"/>

  <rect x="50" y="125" width="1535" height="78" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text class="note" x="75" y="157"><tspan font-weight="700">Comparacao controlada:</tspan><tspan> mesmas divisao, pesos do extrator, seed, transforms, batch, loss, otimizador, scheduler e criterio de parada.</tspan></text>
  <text class="note" x="75" y="184"><tspan font-weight="700">Blindagem:</tspan><tspan> labels, mascaras e categorias do teste sao usados somente no calculo e agrupamento das metricas, nunca na entrada do modelo.</tspan></text>
</svg>
